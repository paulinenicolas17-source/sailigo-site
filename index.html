<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sailigo — Choisis ta langue · Choose your language</title>
<meta name="description" content="Sailigo met en relation capitaines et équipier·es pour naviguer près de chez toi. Sailigo connects skippers and crew members to go sailing near you.">
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="style.css">
<link rel="alternate" hreflang="fr" href="https://sailigo.org/fr/">
<link rel="alternate" hreflang="en" href="https://sailigo.org/en/">
<link rel="alternate" hreflang="x-default" href="https://sailigo.org/">
<script>
  // Déjà venu·e et déjà choisi : on va directement à la bonne langue.
  // « replace » : le bouton Retour ne ramène pas sur ce choix.
  (function () {
    var langue = null;
    try { langue = localStorage.getItem('langue-site'); } catch (e) {}
    if (langue === 'fr' || langue === 'en') window.location.replace(langue + '/');
  })();
</script>
</head>
<body class="entree">

<main class="entree-dedans">
  <div class="entree-haut">
    <img class="entree-bateau" src="bateau.png" alt="" width="160" height="160">
    <h1>Sailigo</h1>
    <span class="entree-trait" aria-hidden="true"></span>
    <p class="entree-accroche"><span>Trouve ton équipage.</span> <span>Trouve ton embarquement.</span></p>
    <p class="entree-accroche-en" lang="en">Find your crew. Find your boat.</p>
  </div>

  <div class="entree-bas">
    <p class="entree-consigne">Choisis ta langue · <span lang="en">Choose your language</span></p>
    <a class="entree-choix" href="fr/" data-langue="fr" hreflang="fr">
      <span class="entree-code">FR</span>
      <span class="entree-libelle"><strong>Français</strong><span>Continuer en français</span></span>
      <span class="entree-fleche" aria-hidden="true">→</span>
    </a>
    <a class="entree-choix" href="en/" data-langue="en" hreflang="en" lang="en">
      <span class="entree-code">EN</span>
      <span class="entree-libelle"><strong>English</strong><span>Continue in English</span></span>
      <span class="entree-fleche" aria-hidden="true">→</span>
    </a>
  </div>
</main>

<script>
  // La langue du navigateur en premier, mise en avant.
  (function () {
    var anglais = !/^fr/i.test(navigator.language || 'fr');
    var choix = document.querySelectorAll('.entree-choix');
    var premier = anglais ? choix[1] : choix[0];
    premier.classList.add('entree-principal');
    premier.parentNode.insertBefore(premier, premier.parentNode.querySelector('.entree-choix'));
  })();
</script>
<script>
  document.querySelectorAll('[data-langue]').forEach(function (a) {
    a.addEventListener('click', function () {
      try { localStorage.setItem('langue-site', a.getAttribute('data-langue')); } catch (e) {}
    });
  });
</script>
</body>
</html>
